name: Vercel CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-deploy:
    name: Build, Lint & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install Dependencies
        run: bun install

      - name: Lint Project
        run: bun run lint

      - name: Build Project
        run: bun run build

      - name: Deploy to Vercel (CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ℹ️ Vercel secrets are not configured in GitHub Repository Secrets."
            echo "ℹ️ Skipping Vercel CLI deployment. If your repository is connected to Vercel, Vercel will deploy automatically via native Git integration."
            echo "### ℹ️ Vercel Deployment Notice" >> $GITHUB_STEP_SUMMARY
            echo "Build and lint checks passed successfully! ✅" >> $GITHUB_STEP_SUMMARY
            echo "Vercel CLI secrets were not provided — native Vercel Git integration handles deployment automatically." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install --global vercel@latest

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Deploying preview to Vercel..."
            vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
            vercel build --token=$VERCEL_TOKEN
            PREVIEW_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
            echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "### 🚀 Vercel Preview Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Preview URL: [$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Deploying production to Vercel..."
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            vercel build --prod --token=$VERCEL_TOKEN
            PROD_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
            echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT
            echo "### 🎉 Vercel Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Production URL: [$PROD_URL]($PROD_URL)" >> $GITHUB_STEP_SUMMARY
          fi
